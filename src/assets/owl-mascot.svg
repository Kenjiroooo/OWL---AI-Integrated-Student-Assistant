<svg viewBox="42 44 171 171" xmlns="http://www.w3.org/2000/svg">
    <!-- Talons -->
    <rect x="90" y="215" width="20" height="24" rx="10" fill="#f6c342" stroke="#0a2949" stroke-width="6" />
    <rect x="110" y="215" width="20" height="24" rx="10" fill="#f6c342" stroke="#0a2949" stroke-width="6" />
    <rect x="126" y="215" width="20" height="24" rx="10" fill="#f6c342" stroke="#0a2949" stroke-width="6" />
    <rect x="146" y="215" width="20" height="24" rx="10" fill="#f6c342" stroke="#0a2949" stroke-width="6" />

    <!-- Wings -->
    <path d="M 70 120 C 30 150 40 220 80 230 C 70 190 80 150 90 120 Z" fill="#0b4c79" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />
    <path d="M 186 120 C 226 150 216 220 176 230 C 186 190 176 150 166 120 Z" fill="#0b4c79" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Main Body -->
    <path d="M 80 100 C 40 160 60 225 128 225 C 196 225 216 160 176 100 C 150 70 106 70 80 100 Z" fill="#1878a9" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Belly Circuit Pattern -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 128 200 L 128 175" />
        <path d="M 128 190 L 145 175" />
        <path d="M 128 180 L 105 160" />
        <path d="M 115 168 L 100 178" />
        <path d="M 135 183 L 150 193" />
    </g>
    <g fill="#ffffff">
        <circle cx="105" cy="160" r="5" />
        <circle cx="145" cy="175" r="5" />
        <circle cx="100" cy="178" r="5" />
        <circle cx="150" cy="193" r="5" />
    </g>

    <!-- Face Mask -->
    <path d="M 60 110 C 60 150 100 160 128 140 C 156 160 196 150 196 110 C 196 70 150 80 128 90 C 106 80 60 70 60 110 Z" fill="#0b4c79" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Eyes -->
    <circle cx="95" cy="115" r="28" fill="#ffffff" stroke="#0a2949" stroke-width="6" />
    <circle cx="161" cy="115" r="28" fill="#ffffff" stroke="#0a2949" stroke-width="6" />

    <!-- Pupils -->
    <circle cx="100" cy="115" r="18" fill="#0a2949" />
    <circle cx="156" cy="115" r="18" fill="#0a2949" />

    <!-- Pupil Highlights -->
    <circle cx="106" cy="108" r="6" fill="#ffffff" />
    <circle cx="162" cy="108" r="6" fill="#ffffff" />
    <circle cx="95" cy="122" r="2.5" fill="#ffffff" />
    <circle cx="151" cy="122" r="2.5" fill="#ffffff" />

    <!-- Closed beak -->
    <path d="M 120 135 Q 128 130 136 135 L 128 165 Z" fill="#f6c342" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Eyebrows -->
    <path d="M 50 90 C 70 70 100 75 128 90 C 156 75 186 70 206 90 C 190 60 160 60 128 75 C 96 60 66 60 50 90 Z" fill="#1878a9" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Graduation Cap -->
    <path d="M 85 60 L 80 90 Q 128 100 176 90 L 171 60 Z" fill="#0b4c79" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />
    <path d="M 128 20 L 210 50 L 128 80 L 46 50 Z" fill="#0b4c79" stroke="#0a2949" stroke-width="6" stroke-linejoin="round" />

    <!-- Tassel -->
    <path d="M 128 50 Q 80 60 70 80" fill="none" stroke="#f6c342" stroke-width="4" />
    <path d="M 70 80 L 60 110 L 80 110 Z" fill="#f6c342" stroke="#0a2949" stroke-width="4" stroke-linejoin="round" />
    <path d="M 64 110 L 64 125 M 70 110 L 70 125 M 76 110 L 76 125" stroke="#f6c342" stroke-width="3" stroke-linecap="round" />
    <circle cx="128" cy="50" r="5" fill="#f6c342" />
</svg>
