<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Assistance Smart Kiosk - Start Page</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#b2c5ff",
                        "tertiary-fixed-dim": "#c3c7cb",

                        "primary": "#00317e",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dadadc",
                        "surface-container-highest": "#e2e2e5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#001e2b",
                        "surface-tint": "#2559bf",
                        "secondary-fixed": "#c2e8ff",
                        "on-tertiary-fixed-variant": "#43474b",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#bbbfc3",
                        "primary-fixed": "#dae2ff",
                        "surface-container": "#eeeef0",
                        "surface-container-low": "#f3f3f6",
                        "tertiary-fixed": "#dfe3e7",
                        "on-background": "#1a1c1e",
                        "on-primary-fixed": "#001847",
                        "tertiary": "#32373a",
                        "surface": "#f9f9fc",
                        "secondary-container": "#00c1fd",
                        "secondary": "#006688",
                        "outline-variant": "#c3c6d5",
                        "on-surface": "#1a1c1e",
                        "on-surface-variant": "#434653",
                        "tertiary-container": "#494e51",
                        "background": "#f9f9fc",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e8e8ea",
                        "inverse-surface": "#2f3133",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e2e2e5",
                        "on-secondary-container": "#004b65",
                        "primary-container": "#0046ad",
                        "on-primary-fixed-variant": "#0040a0",
                        "on-tertiary-fixed": "#171c1f",
                        "primary-fixed-dim": "#b2c5ff",
                        "on-primary-container": "#a5bdff",

                        "secondary-fixed-dim": "#75d1ff",
                        "outline": "#737784",
                        "on-error": "#ffffff",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "32px",

                        "base": "8px",
                        "gutter": "24px",
                        "margin-page": "40px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "label-lg": ["Work Sans"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],

                    "boxShadow": {

<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col relative select-none">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none bg-gradient-to-br from-surface-bright to-surface-container-low">
<div class="absolute top-[-10%] right-[-5%] w-[800px] h-[800px] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[600px] h-[600px] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Status Header - Suppressed navigation shell for Start Page as per rules, but keeping a minimal status bar for kiosk context -->
<header class="relative z-10 flex justify-between items-center w-full px-margin-page py-4 max-w-full bg-transparent">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_library</span>
<span class="font-label-lg text-label-lg font-bold uppercase tracking-wider">Student Assistance</span>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2 text-on-surface-variant font-label-lg text-label-lg">
<span class="material-symbols-outlined">schedule</span>
<span class="uppercase" id="clock">10:42 AM</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-lg text-label-lg">
<span class="material-symbols-outlined">sensors</span>
<span class="uppercase">Live</span>
</div>
</div>
</header>
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-page">
<div class="text-center max-w-3xl mb-16 space-y-6">
<div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-primary-container text-on-primary-container mb-4 shadow-soft">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Welcome to Campus Hub</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">
                Your central touchpoint for academic assistance, campus navigation, and student services.
            </p>
</div>
<div class="relative group cursor-pointer" onclick="document.body.classList.add('opacity-0', 'transition-opacity', 'duration-500'); setTimeout(() =&gt; window.location.reload(), 500);">
<div class="absolute inset-0 bg-primary rounded-full pulse-ring pointer-events-none"></div>
<button class="relative bg-primary hover:bg-primary-container text-on-primary font-headline-md text-headline-md px-16 py-8 rounded-full shadow-lg transition-all duration-300 transform group-hover:scale-95 group-active:scale-95 flex items-center gap-4 min-h-[80px]">
                Touch to Begin
                <span class="material-symbols-outlined text-3xl">touch_app</span>
</button>
</div>
<div class="mt-24 flex items-center gap-4 text-on-surface-variant font-label-lg text-label-lg opacity-70">
<span class="material-symbols-outlined text-lg">info</span>
<span>Guest Mode Enabled - No login required</span>
</div>
</main>
<script>
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            const strTime = hours + ':' + minutes + ' ' + ampm;
            document.getElementById('clock').textContent = strTime;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body></html>
